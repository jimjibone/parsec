# nginx in front of parsec (alternative to Caddy).
server {
    listen 443 ssl;
    server_name parsec.example.com;

    ssl_certificate     /etc/ssl/parsec/fullchain.pem;
    ssl_certificate_key /etc/ssl/parsec/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7343;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live updates use server-sent events: keep the stream open, unbuffered.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
